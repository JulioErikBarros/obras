        </div>

    <!-- Page Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <button class="btn btn-secondary d-lg-none toggle-sidebar-btn" id="toggleSidebarBtn"><i class="bi bi-list"></i></button>
                <i class="bi bi-file-earmark-text text-primary d-none d-sm-inline-block"></i> Gestão de Documentos
            </h2>
            <button class="btn btn-primary" onclick="openDocumentoModal()"><i class="bi bi-cloud-arrow-up"></i> Upload de Documento</button>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Obra</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="documentosTableBody">
                    <!-- Dinâmico -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Documento -->
<div class="modal fade" id="documentoModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-file-earmark-arrow-up text-primary"></i> Enviar Novo Documento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form novalidate id="documentoForm" class="row g-3">
                    <div class="col-12">
                        <label for="docObraId" class="form-label required-label">Obra Vinculada</label>
                        <select class="form-select" id="docObraId" required>
                            <!-- Dinâmico -->
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="docNome" class="form-label required-label">Nome do Documento</label>
                        <input type="text" class="form-control" id="docNome" required placeholder="Ex: Projeto Elétrico Aprovado">
                    </div>
                    <div class="col-12">
                        <label for="docTipo" class="form-label required-label">Tipo de Documento</label>
                        <select class="form-select" id="docTipo" required>
                            <option value="Planta">Planta</option>
                            <option value="Alvará">Alvará</option>
                            <option value="Contrato">Contrato</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="docArquivo" class="form-label required-label">Arquivo (PDF, Imagens, DOC - máx 5MB)</label>
                        <input type="file" class="form-control" id="docArquivo" required>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-upload"></i> Fazer Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/documentos.js"></script>

</body>
