        <div class="d-flex justify-content-between align-items-center mb-4">

                <button class="btn btn-secondary d-lg-none toggle-sidebar-btn" id="toggleSidebarBtn"><i class="bi bi-list"></i></button>

        </div>

        <div class="accordion" id="etapasAccordion">
            <!-- Dinâmico -->
        </div>

<!-- Modal Etapa -->
<div class="modal fade" id="etapaModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="etapaModalTitle"><i class="bi bi-list-check text-primary"></i> Nova Etapa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form novalidate id="etapaForm" class="row g-3">
                    <input type="hidden" id="etapaId">
                    <div class="col-12">
                        <label for="etapaObraId" class="form-label required-label">Obra</label>
                        <select class="form-select" id="etapaObraId" required>
                            <!-- Dinâmico -->
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="etapaNome" class="form-label required-label">Nome da Etapa</label>
                        <input type="text" class="form-control" id="etapaNome" required placeholder="Ex: Fundações e Pilares">
                    </div>
                    <div class="col-12">
                        <label for="etapaDescricao" class="form-label required-label">Descrição / Detalhes</label>
                        <textarea class="form-control" id="etapaDescricao" rows="2" required placeholder="Descreva os serviços a serem realizados nesta etapa..."></textarea>
                    </div>
                    <div class="col-12">
                        <label for="etapaObservacoes" class="form-label">Observações</label>
                        <textarea class="form-control" id="etapaObservacoes" rows="2" placeholder="Observações e notas adicionais..."></textarea>
                    </div>
                    <div class="col-12">
                        <label for="etapaStatus" class="form-label">Status</label>
                        <select class="form-select" id="etapaStatus">
                            <option>Pendente</option>
                            <option>Em andamento</option>
                            <option>Concluída</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="etapaPercentual" class="form-label">Percentual Concluído (%)</label>
                        <input type="number" class="form-control" id="etapaPercentual" min="0" max="100" placeholder="Ex: 50">
                    </div>
                    <div class="col-12">
                        <label for="etapaEquipeId" class="form-label">Equipe Responsável</label>
                        <select class="form-select" id="etapaEquipeId">
                            <option value="">Nenhuma Equipe</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="etapaResponsavelId" class="form-label">Funcionário Responsável</label>
                        <select class="form-select" id="etapaResponsavelId">
                            <option value="">Nenhum Responsável</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="etapaDataInicio" class="form-label">Data Início</label>
                        <input type="date" class="form-control" id="etapaDataInicio">
                    </div>
                    <div class="col-md-6">
                        <label for="etapaDataFimPrevista" class="form-label">Data Final Prevista</label>
                        <input type="date" class="form-control" id="etapaDataFimPrevista">
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save"></i> Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
