            <li class="">

                    <span><i class="bi bi-bell"></i> Notificações</span>

            <button class="theme-toggle-btn" onclick="auth.toggleTheme()" title="Alternar Tema (Claro/Escuro)"><i class="bi bi-brightness-high"></i></button>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <button class="btn btn-secondary d-lg-none toggle-sidebar-btn" id="toggleSidebarBtn"><i class="bi bi-list"></i></button>
                <i class="bi bi-building-fill text-primary d-none d-sm-inline-block"></i> Gestão de Obras
            </h2>
            <button class="btn btn-primary" onclick="openObraModal()"><i class="bi bi-plus-lg"></i> Nova Obra</button>
        </div>

        <!-- Filtros -->
        <div class="card p-4 mb-4">
            <form novalidate id="filtroObrasForm" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="filtroStatusObra" class="form-label">Status</label>
                    <select class="form-select" id="filtroStatusObra">
                        <option value="">Todos</option>
                        <option value="Em planejamento">Em planejamento</option>
                        <option value="Em andamento">Em andamento</option>
                        <option value="Concluída">Concluída</option>
                        <option value="Paralisada">Paralisada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="filtroNomeObra" class="form-label">Buscar por Nome</label>
                    <input type="text" class="form-control" id="filtroNomeObra" placeholder="Digite o nome da obra...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel"></i> Filtrar</button>
                </div>
            </form>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Status</th>
                        <th>Responsável</th>
                        <th>Início</th>
                        <th>Conclusão</th>
                        <th style="width: 15%;">Progresso</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="obrasTableBody">
                    <!-- Dinâmico -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Obra -->
<div class="modal fade" id="obraModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="obraModalTitle"><i class="bi bi-building-add text-primary"></i> Nova Obra</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form novalidate id="obraForm" class="row g-3">
                    <input type="hidden" id="obraId">
                    <div class="col-md-8">
                        <label for="obraNome" class="form-label required-label">Nome da Obra</label>
                        <input type="text" class="form-control" id="obraNome" required placeholder="Ex: Residencial Vista Verde">
                    </div>
                    <div class="col-md-4">
                        <label for="obraTipo" class="form-label required-label">Tipo de Obra</label>
                        <select class="form-select" id="obraTipo" required>
                            <option value="Casa">Casa</option>
                            <option value="Apartamento">Apartamento</option>
                            <option value="Reforma">Reforma</option>
                            <option value="Condomínio">Condomínio</option>
                            <option value="Comercial">Comercial</option>
                            <option value="Industrial">Industrial</option>
                            <option value="Galpão">Galpão</option>
                            <option value="Outros" selected>Outros</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label for="obraEndereco" class="form-label">Endereço</label>
                        <input type="text" class="form-control" id="obraEndereco" placeholder="Av. das Nações, 1500 - Bloco B">
                    </div>
                    <div class="col-md-4">
                        <label for="obraStatus" class="form-label">Status</label>
                        <select class="form-select" id="obraStatus">
                            <option>Em planejamento</option>
                            <option>Em andamento</option>
                            <option>Concluída</option>
                            <option>Paralisada</option>
                            <option>Cancelada</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="obraDescricao" class="form-label required-label">Descrição / Detalhes</label>
                        <textarea class="form-control" id="obraDescricao" rows="3" required placeholder="Descreva os escopos, metragens e particularidades da obra..."></textarea>
                    </div>
                    <div class="col-12">
                        <label for="obraResponsavelId" class="form-label">Engenheiro / Resp. Técnico</label>
                        <select class="form-select" id="obraResponsavelId">
                            <option value="">Nenhum</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="obraDataInicio" class="form-label">Data Início</label>
                        <input type="date" class="form-control" id="obraDataInicio">
                    </div>
                    <div class="col-md-4">
                        <label for="obraDataFim" class="form-label">Data Fim Prev.</label>
                        <input type="date" class="form-control" id="obraDataFim">
                    </div>
                    <div class="col-md-4">
                        <label for="obraPercentual" class="form-label">% Concluído (Calculado)</label>
                        <div class="input-group">
                            <input type="number" step="0.01" class="form-control" id="obraPercentual" value="0" min="0" max="100" readonly>
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save"></i> Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
