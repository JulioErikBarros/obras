<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Caba Desenrolado ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <main class="login-card">
        <h3 class="text-center mb-1">Caba Desenrolado ERP</h3>
        <p class="text-center">Bem-vindo! Entre com suas credenciais para continuar.</p>
        <form novalidate id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label required-label">E-mail</label>
                <input type="email" class="form-control" id="email" required value="admin@admin.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label required-label">Senha</label>
                <input type="password" class="form-control" id="senha" required value="password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
        </form>
    </main>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            form.classList.add('was-validated');
            if (!form.checkValidity()) {
                return;
            }
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const success = await auth.login(email, senha);
            if (success) {
                window.location.href = 'pages/dashboard.html';
            }
        });
    </script>
</body>
</html>
